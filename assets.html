<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assets Management</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/assets.css">
    <link rel="stylesheet" href="css/news.css">
    <link rel="stylesheet" href="css/headerfooter.css">
    
    <script src="js/header.js"defer></script>
    <script src="js/auth.js"defer></script>
    <script src="js/calculator.js"defer></script>
    <script src="js/assets.js" defer></script> 
</head>
<body>

<div id="news-placeholder"></div>
<script src="js/news.js"></script>
<script>
  fetch("news.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("news-placeholder").innerHTML = data;
          loadNews(); 
    });
</script>

    <nav class="navbar">

        <div class="nav-left">
          <div ><a class="logo" href="index.html">Golden Tracker</a></div>
        </div>
          
          <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="assets.html">MY Assets</a>
          </div>

        <div class="nav-right">

          <div class="botton-container">
            <button class="active" id="usdBtn">USD</button>
            <button  id="jodBtn">JOD</button>
          </div>

          <div class="botton-container" id="loginBtnCon">
            <button class="active" id="loginBtn" >Login</button>
            <button id="signUpBtn">SignUp</button>
          </div>

          <div class="botton-container" id="lotoutBtnCon">
            <button class="active" id="logoutBtn" >LogOut</button>
          </div>

        </div>

      </nav>
    
    <div class="mainclass">
        
        <h2 class="Title-page">Assets Page</h2>
        
        <div class="cardvalue">
            <div class="shapcard">

                <p class="txtcard">weights</p>
                <p class="totalvalue" id="totalWeight">0 g</p>
            </div>
            <div class="shapcard">

                <p class="txtcard">Purchase cost</p>
                <p class="totalvalue" id="PurchaseCost">$0.00</p>

            </div>
            <div class="shapcard">

                <p class="txtcard">current value</p>
                <p class="totalvalue" id="CurrentValue">$0.00</p>

            </div>
            <div class="shapcard Profit-loss">

                <p class="txtcard">Profit/loss</p>
                <p class="totalvalue" id="ProfitLoss">$0.00</p>

            </div>
        </div>
        

    <div class="form-container" id="formContainer">
        
            <h3 class="form-title">Add New Assets </h3>

        <form class="gold-form" id="goldForm">

                <div class="input-group">
                    <label>Type</label>
                    <select  id="goldType">
                        <option>Ingot</option>
                        <option>Rashadi Lira</option>
                        <option>Onsa</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>purity</label>
                    <select id="goldKarat">
                        <option>24 Karat</option>
                        <option>21 Karat</option>
                        <option>18 Karat</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Purchase Price per Gram</label>
                    <input id="priceGram" type="number" step="0.01" placeholder="Example: 55.00">
                </div>

                <div class="input-group">
                    <label>Weight (gram)</label>
                    <input id="goldWeight" type="number" step="0.01" placeholder="Example: 10">
                </div>

                <div class="input-group">
                    <label>Notes (Optional)</label>
                    <input type="text" id="goldNotes" >
                </div>

                <div class="input-group">
                    <label>Purchase Date</label>
                    <input type="date" id="goldDate">
                </div>

                <input type="file" id="goldImage"  accept="image/*">

                <div class="button-group">
                    <button type="submit" class="add-btn">+ Add Assets </button>
                </div>

                

        </form>

        <div id="messageAssets" class="View-assets"></div>

    </div>

        <div class="assets-display-section" id="assetsSection">
            <h3 class="section-subtitle">My Assets</h3>
            <input type="search" id="searchAssets" class="search-assets" placeholder= "Search assets.">
            <div class="assets-scroll-container">
                 <div id="assetsContainerlist" class="assets-container-list"></div>
            </div>
        </div>
        

    </div>
 </body>
</html>
